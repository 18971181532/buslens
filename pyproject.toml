[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "buslens"
version = "1.0.0"
description = "Embedded bus signal workbench: decode I2C/SPI/UART/PWM/WS2812 captures into transactions, registers and timing verdicts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "BusLens contributors" }]
keywords = [
    "embedded", "microcontroller", "mcu", "logic-analyzer", "protocol-decoder",
    "i2c", "spi", "uart", "ws2812", "pwm", "vcd", "firmware", "testbench",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.scripts]
buslens = "buslens.cli:main"

[project.urls]
Homepage = "https://github.com/18971181532/buslens"
Repository = "https://github.com/18971181532/buslens"
Issues = "https://github.com/18971181532/buslens/issues"

[tool.setuptools]
packages = ["buslens"]

[tool.setuptools.package-data]
buslens = ["web/*.html", "web/*.css", "web/*.js"]
